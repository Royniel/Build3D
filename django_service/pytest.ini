[pytest]
# pytest-django needs to know which settings module to import before it can
# touch the ORM. USE_SQLITE is honoured by config/settings.py so the suite can
# run without a Postgres container; CI and docker-compose leave it unset and
# test against Postgres.
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = orders/tests
addopts = -ra --strict-markers
filterwarnings =
    error::DeprecationWarning:orders.*
